name: Backend

on:
  push:
    paths: ["backend/**", "knowledge/**", "eval/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "knowledge/**", "eval/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: haven_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests (SQLite)
        run: pytest -q
      - name: Migrations (PostgreSQL + pgvector)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/haven_test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Tests (PostgreSQL + pgvector)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/haven_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/haven_test
        run: pytest -q
